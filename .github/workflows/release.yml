name: Release

# Pushing a tag like v0.2.0 publishes version 0.2.0 to Maven Central. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$version" == *SNAPSHOT ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release version like v0.2.0"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: ./gradlew test

      # Uploads, waits for Maven Central to validate, then publishes. Nothing is published if validation fails.
      - run: ./gradlew publishAndReleaseToMavenCentral -Pversion="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
